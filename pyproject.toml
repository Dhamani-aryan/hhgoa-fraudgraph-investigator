[project]
name = "fraudgraph-investigator"
version = "0.1.0"
description = "HHGOA TigerGraph agentic fraud investigation agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyTigerGraph>=1.6",
    "tigergraph-mcp",
    "langgraph>=0.2",
    "streamlit>=1.38",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
